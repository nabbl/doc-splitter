name: Test and publish immutable image

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.9.17
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: uv sync --locked
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pytest -q -m "not model"
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -t doc-splitter:acceptance .
      - name: Cold real-model, offline restart and forced-termination acceptance
        run: uv run python -m tests.container_acceptance

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nabbl/doc-splitter:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record deployable immutable reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/nabbl/doc-splitter@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
